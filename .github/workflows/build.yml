name: Build KendrickCraft

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KendrickCraft-JAR
          path: build/libs/*.jar
