name: Build KendrickCraft

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KendrickCraft-JAR
          path: build/libs/*.jar

      - name: Publish GitHub Release 1.0.1
        if: success() && contains(github.event.head_commit.message, 'Publish KendrickCraft 1.0.1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.1 build/libs/*.jar --title "KendrickCraft 1.0.1" --notes "Actualización de KendrickCraft. Compatible con Minecraft Java 1.21.1 y NeoForge 21.1.248. Incluye el mapa orbital que se abre con M."